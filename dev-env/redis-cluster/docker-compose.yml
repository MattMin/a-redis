      - --bind
      - 0.0.0.0
      - --protected-mode
      - "no"
      - --appendonly
      - "no"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-hostname
      - redis-node-6
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    ports:
      - "7006:6379"
      - "17006:16379"
    volumes:
      - redis-cluster-node-6:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis-cluster-init:
    image: redis:7.2-alpine
    container_name: aredis-redis-cluster-init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    entrypoint: >
      sh -c '
        sleep 8
        yes yes | redis-cli --cluster create \
          redis-node-1:6379 \
          redis-node-2:6379 \
          redis-node-3:6379 \
          redis-node-4:6379 \
          redis-node-5:6379 \
          redis-node-6:6379 \
          --cluster-replicas 1
      '
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis-cluster-node-1:
  redis-cluster-node-2:
  redis-cluster-node-3:
  redis-cluster-node-4:
  redis-cluster-node-5:
  redis-cluster-node-6:

