services:
  redis-node-1:
    image: redis:7.2-alpine
    container_name: aredis-redis-node-1
    hostname: redis-node-1
    command:
      - redis-server
      - --port
      - "6379"
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "no"
      - --appendonly
      - "no"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-hostname
      - redis-node-1
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    ports:
      - "7001:6379"
      - "17001:16379"
    volumes:
      - redis-cluster-node-1:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis-node-2:
    image: redis:7.2-alpine
    container_name: aredis-redis-node-2
