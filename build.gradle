plugins {
    id 'java'
    id "org.jetbrains.intellij.platform" version "2.13.1"
}

group = 'com.mzyupc'
version = '1.3.0'

repositories {
    mavenCentral()
    maven { url = 'https://plugins.gradle.org/m2/' }
    intellijPlatform {
        defaultRepositories()
      }
}

dependencies {
    // 调试插件的 IDEA 版本
    intellijPlatform {
        intellijIdea("2026.1.2")

        bundledPlugin("com.intellij.java")

        pluginVerifier()
        zipSigner()
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.1'

    // jedis
    implementation ("redis.clients:jedis:5.2.0") {
        exclude group: "org.slf4j"
    }

    implementation 'com.github.mwiede:jsch:0.2.21'

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}

patchPluginXml {
    // 声明插件适用的版本 241.19416.15 (2024.1.7)
    sinceBuild = '241.19416.15'
    untilBuild = provider { null }
    changeNotes = """
      1.2.0<br>
      <ul>
          <li>Improved the Filter search experience: you can now type a keyword directly and wildcards are added automatically.</li>
          <li>Filter search now runs automatically after a short pause in typing and ignores leading/trailing spaces.</li>
          <li>Optimized the Filter input width so it expands with the current text.</li>
          <li>Upgraded Jedis to version 5.2.0.</li>
          <li>Upgraded the IntelliJ Platform Gradle Plugin and Gradle wrapper for the latest build tooling.</li>
      </ul>

      1.1.0<br>
      <ul>
          <li>Compatible with version 2024.3</li>
      </ul>

      1.0.0<br>
      <ul>
          <li>Solved the issue of slow DB opening with a million data entries</li>
          <li>Resolved the "EventQueue.isDispatchThread()=false" issue</li>
          <li>Fixed the NPE issue with "Test Connection"</li>
          <li>Added a complex confirmation method when flushing the DB</li>
          <li>Updated deprecated API calls</li>
          <li>Utilized Java 17</li>
          <li>Added a logo</li>
          <li>Removed key pagination, now showing up to 20,000 keys. Use the 'Filter' feature if the desired key is not found in the results.</li>
      </ul>

      beta-0.9.0<br>
      <ul>
          <li>Use `PasswordSafe` to save your password</li>
          <li>Upgrade Jedis version to 4.2.3</li>
          <li>Configuration of Username is supported in Connection Settings Dialog</li>
      </ul>

      beta-0.8.0</br>
      <ul>
          <li>update: update deprecated API</li>
          <li>fix: background display issues when using third party themes</li>
          <li>fix: freezing the UI while loading</li>
      </ul>

      beta-0.7.0</br>
      <ul>
          <li>update: the Dialog's OK/Cancel buttons are arranged in a different order depending on the operating system.</li>
      </ul>

      beta-0.6.0</br>
      <ul>
          <li>new: redis connection right-click menu adds "Info" function</li>
          <li>new: the connection can be set to global in the connection PropertyUtilsettings popup</li>
          <li>update: fix redis console line height</li>
          <li>update: use jackson to serialize json</li>
      </ul>

      beta-0.5.0</br>
      <ul>
          <li>new: redis console(The 'RESTORE' command and blocking commands such as 'SUBSCRIBE' are not supported)</li>
          <li>fix: reload connection bug</li>
          <li>update: query the number of DBs without using the 'CONFIG GET' command</li>
          <li>update: replace Label with Jlabel</li>
      </ul>

      beta-0.3.4</br>
      <ul>
          <li>update: add plugin description</li>
      </ul>

      beta-0.3</br>
      <ul>
          <li>update: value格式化</li>
      </ul>

      beta-0.2</br>
      <ul>
          <li>fix: 不同项目会出现相同的connection</li>
          <li>update: 支持最早版本到201.8743.12</li>
          <li>update: Key分页Page Size的计算</li>
      </ul>

      beta-0.1</br>
      <ul>
          <li>first version</li>
      </ul>

      """
}
test {
    useJUnitPlatform()
}

intellijPlatform {
    buildSearchableOptions = false

    pluginVerification {
        ides {
            recommended()
        }
    }
}
