plugins {
    id 'java'
    id "org.jetbrains.intellij.platform" version "2.13.1"
}

group = 'com.mzyupc'
version = '1.4.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

repositories {
    mavenCentral()
    maven { url = 'https://plugins.gradle.org/m2/' }
    intellijPlatform {
        defaultRepositories()
      }
}

dependencies {
    // 调试插件的 IDEA 版本
    intellijPlatform {
        intellijIdea("2026.2")
//        intellijIdea("2024.1.7")

        bundledPlugin("com.intellij.java")

        pluginVerifier()
        zipSigner()
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.1'

    // jedis
    implementation ("redis.clients:jedis:5.2.0") {
        exclude group: "org.slf4j"
    }

    implementation 'com.github.mwiede:jsch:0.2.21'

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}

patchPluginXml {
    // 声明插件适用的版本 241.19416.15 (2024.1.7)
    sinceBuild = '241.19416.15'
    untilBuild = provider { null }
    changeNotes = """
      1.4.0<br>
      <ul>
          <li>Updated the build target to IntelliJ IDEA 2026.2 and Java 25.</li>
          <li>Fixed plugin startup failures on IntelliJ IDEA 2026.2 caused by legacy Apache Commons Collections API usages.</li>
          <li>Replaced deprecated IntelliJ Platform and Apache Commons Lang API usages to improve forward compatibility.</li>
      </ul>

      """
}
test {
    useJUnitPlatform()
}

intellijPlatform {
    buildSearchableOptions = false

    pluginVerification {
        ides {
            recommended()
        }
    }
}
